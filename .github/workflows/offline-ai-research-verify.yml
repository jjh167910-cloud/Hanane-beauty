name: Offline AI research verification
on:
  workflow_dispatch:
  push:
    branches:
      - research/offline-generative-feasibility-2026-10-21
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run test:unit
      - name: Install headless browser test dependencies
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify genuine browser-only hair segmentation
        run: node scripts/real-browser-inference-smoke.mjs
      - name: Train and evaluate isolated synthetic pose-flow student (NO real images)
        run: npm run research:pose:synthetic
      - name: Obtain pinned Apache-2.0 multiclass model for research only
        run: npm run build:offhair:multiclass
      - name: Run real source/reference hair difference-mask topology offline experiment
        run: node scripts/real-offhair-difference-mask-smoke.mjs
      - name: Verify browser-local OffHair ground-truth drawing, metadata export and offline reload
        run: node scripts/real-offhair-annotator-smoke.mjs
      - name: Build research-only MI-GAN (pinned checksum)
        run: npm run build:migan
      - name: Verify browser-only neural inpainting and airplane-mode rerun
        run: node scripts/real-migan-browser-smoke.mjs
      - name: Verify integrated face-protected hair removal in-browser, including offline rerun
        run: node scripts/real-hair-removal-studio-smoke.mjs
      - name: Validate measured research evidence against the frozen protocol
        run: |
          npm run research:validate
          npm run research:summary
      - name: Archive anonymous metadata-only research results
        uses: actions/upload-artifact@v4
        with:
          name: offhair-research-evidence
          path: |
            research/paper/protocol-v1.json
            research/results/offhair-ci-smoke-evidence.json
            research/results/offhair-phase19-synthetic-study.json
          retention-days: 30
          if-no-files-found: error
      - name: Package complete offline website
        uses: actions/upload-artifact@v4
        with:
          name: hananeh-offline-research-site
          path: public/
          retention-days: 14
          if-no-files-found: error
      - name: Verify complete offline model assets
        run: |
          test -s public/ai/models/hair_segmenter.tflite
          test -s public/ai/models/blaze_face_short_range.tflite
          test -s public/ai/wasm/vision_wasm_internal.wasm
          test -s public/ai/wasm/vision_wasm_nosimd_internal.wasm
          test -s public/_headers
