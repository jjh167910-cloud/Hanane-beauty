name: Offline AI research verification
on:
  workflow_dispatch:
  push:
    branches:
      - research/offline-generative-feasibility-2026-10-21
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run test:unit
      - name: Install headless browser test dependencies
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify genuine browser-only hair segmentation
        run: node scripts/real-browser-inference-smoke.mjs
      - name: Package complete offline website
        uses: actions/upload-artifact@v4
        with:
          name: hananeh-offline-research-site
          path: public/
          retention-days: 14
          if-no-files-found: error
      - name: Verify complete offline model assets
        run: |
          test -s public/ai/models/hair_segmenter.tflite
          test -s public/ai/models/blaze_face_short_range.tflite
          test -s public/ai/wasm/vision_wasm_internal.wasm
          test -s public/ai/wasm/vision_wasm_nosimd_internal.wasm
          test -s public/_headers
